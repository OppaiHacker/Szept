# Desktop client (wails) for Linux and Windows plus the connector for every
# platform in `make release`. A push to main leaves the binaries as workflow
# artifacts. A push to any other branch publishes them as the prerelease
# dev-<branch>, replaced on every push. A tag publishes them as a release:
# vX.Y.Z as a full release, any other tag (0.4.0-alpha1, v1.0.0-rc1) as a
# prerelease. A release already made by hand for the tag gets the files added.
# Clients only update from /releases/latest, which skips prereleases.
name: build

on:
  push:
    branches: ["**"]
    tags: ["*"]
  workflow_dispatch:

# a new push to the same branch cancels the build still running for it
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # the client's UI is built by Vite (make frontend)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: cmd/szept-wails/frontend/package.json
      # GTK3 + webkit2gtk-4.1: what most distros still ship (see WAILS_TAGS)
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: make bin/szept-wails WAILS_TAGS=gtk3 VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - run: mv bin/szept-wails szept-wails-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: szept-wails-linux-amd64
          path: szept-wails-linux-amd64

  windows:
    # cross-compiled with mingw-w64, the same way `make windows` does it locally
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # the client's UI is built by Vite (make frontend)
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: cmd/szept-wails/frontend/package.json
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 imagemagick nsis
      # Ubuntu ships ImageMagick 6, whose `convert` takes the same arguments
      - run: command -v magick || sudo ln -s "$(command -v convert)" /usr/local/bin/magick
      - run: make bin/szept-setup.exe VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      # the portable exe is what installed copies update themselves from
      - run: mv bin/szept-wails.exe szept-portable-windows-amd64.exe && mv bin/szept-setup.exe szept-setup-windows-amd64.exe
      # v0.3.0 and older update from the pre-rename name.
      # ponytail: drop this copy once those versions are no longer in use
      - run: cp szept-portable-windows-amd64.exe szept-wails-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: szept-wails-windows-amd64
          path: |
            szept-portable-windows-amd64.exe
            szept-setup-windows-amd64.exe
            szept-wails-windows-amd64.exe

  connector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # reproducible build, see the release target in the Makefile
      - run: make release VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: szept-connector
          path: |
            bin/release/szept-connector-*
            bin/release/GOVERSION

  release:
    if: github.ref != 'refs/heads/main'
    needs: [linux, windows, connector]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: publish
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || pre=--prerelease
          else
            tag=dev-${GITHUB_REF_NAME//\//-}
            pre=--prerelease
            gh release delete "$tag" --cleanup-tag --yes || true
          fi
          # VERSION is covered by the sums, so the signature (make sign-release)
          # pins the version too; clients ignore releases until it is signed
          echo "$tag" > VERSION && sha256sum GOVERSION VERSION szept-* > SHA256SUMS
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" $pre --target "$GITHUB_SHA" --generate-notes \
              --notes "Windows: szept-setup-windows-amd64.exe is the installer, szept-portable-windows-amd64.exe runs without installing. szept-wails-windows-amd64.exe is the same portable build, kept only so older versions can update themselves."
          gh release upload "$tag" szept-* GOVERSION VERSION SHA256SUMS --clobber
