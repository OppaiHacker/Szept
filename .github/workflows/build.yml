# Desktop client (wails) for Linux and Windows plus the connector for every
# platform in `make release`. Every push to main leaves the binaries as
# workflow artifacts; a v* tag also publishes them as a release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # GTK3 + webkit2gtk-4.1: what most distros still ship (see WAILS_TAGS)
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: make bin/szept-wails WAILS_TAGS=gtk3
      - run: mv bin/szept-wails szept-wails-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: szept-wails-linux-amd64
          path: szept-wails-linux-amd64

  windows:
    # cross-compiled with mingw-w64, the same way `make windows` does it locally
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 imagemagick
      # Ubuntu ships ImageMagick 6, whose `convert` takes the same arguments
      - run: command -v magick || sudo ln -s "$(command -v convert)" /usr/local/bin/magick
      - run: make bin/szept-wails.exe
      - run: mv bin/szept-wails.exe szept-wails-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: szept-wails-windows-amd64
          path: szept-wails-windows-amd64.exe

  connector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # reproducible build, see the release target in the Makefile
      - run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: szept-connector
          path: |
            bin/release/szept-connector-*
            bin/release/GOVERSION

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, connector]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum GOVERSION szept-* > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" szept-* GOVERSION SHA256SUMS --repo "$GITHUB_REPOSITORY" --generate-notes
