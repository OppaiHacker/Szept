<!doctype html>
<html lang="pl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>szept</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="titlebar" style="--wails-draggable:drag">
    <div class="tb-brand">
      <svg class="tb-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3c-4.7 0-8.5 3.2-8.5 7.2 0 2.3 1.3 4.4 3.3 5.7l-.7 3.6a.5.5 0 0 0 .74.53l3.9-2.3c.4.05.8.07 1.26.07 4.7 0 8.5-3.2 8.5-7.6S16.7 3 12 3Z"/>

      <span class="tb-name">szept</span>
      <span class="tb-sub" id="tb-sub"></span>
    </div>
    <div class="tb-status" id="tb-status" hidden>
      <span class="dot"></span><span class="txt"></span>
    </div>
    <div class="tb-buttons" style="--wails-draggable:no-drag">
      <button class="tb-btn" data-win="min" title="Minimalizuj" aria-label="Minimalizuj">
        <svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg>

      </button>
      <button class="tb-btn danger" data-win="close" title="Zamknij" aria-label="Zamknij">
        <svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="/app.js"></script>
